name: Pint

# Check only. Unlike the Spatie skeleton, this workflow does not push
# "Fix styling" commits; contributors run `composer format` locally.
on:
  push:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/pint.yml'
  pull_request:
    paths:
      - '**.php'
      - 'pint.json'
      - '.github/workflows/pint.yml'

jobs:
  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Check code style
        run: ./vendor/bin/pint --test
